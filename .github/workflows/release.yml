name: Release

# Push a tag like v0.1.0 to build static Linux binaries (amd64 + arm64)
# and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest      # x86_64
            target: x86_64-unknown-linux-musl
            name: linux-amd64
          - runner: ubuntu-24.04-arm   # native arm64 runner (free for public repos)
            target: aarch64-unknown-linux-musl
            name: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          pkg="orico-raid-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$pkg"
          cp "target/${{ matrix.target }}/release/orico-raid" LICENSE README.md "$pkg/"
          tar czf "$pkg.tar.gz" "$pkg"
          sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: orico-raid-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: orico-raid-*
          generate_release_notes: true
